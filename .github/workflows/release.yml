name: Release-Images

# Pusht NUR Multi-Arch-Images nach GHCR. Tag, GitHub-Release, Kundenpaket,
# Dist-Repo und Versions-Index bleiben allein Sache von scripts/release.sh.
#
# P16-04: Der Image-Name wird aus GITHUB_REPOSITORY abgeleitet (Repo-Name,
# kleingeschrieben; Webui mit Suffix -webui). Im privaten Repo ergibt das
# vizpatch und vizpatch-webui wie bisher; ein oeffentliches Repo bekommt eigene
# Pakete ohne Namenskollision.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Phase 16: keine *.dockerbuild-Build-Records als Actions-Artefakte (oeffentliches Repo).
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - {suffix: "", context: agent}
          - {suffix: "-webui", context: webui}
    steps:
      - name: Tag pruefen
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "FEHLER: nur auf einer Tag-Ref erlaubt (ref_type=$REF_TYPE)" >&2
            exit 1
          fi
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FEHLER: Tag '$REF_NAME' passt nicht auf vX.Y.Z" >&2
            exit 1
          fi
      - name: Owner und Image-Name klein
        shell: bash
        env:
          IMG_SUFFIX: ${{ matrix.image.suffix }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMG_NAME=${repo,,}${IMG_SUFFIX}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ env.IMG_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Scan-Build (amd64, ohne Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: release-scan/${{ env.IMG_NAME }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ env.IMG_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMG_NAME }}
      - name: Trivy-Gate vor dem Push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: release-scan/${{ env.IMG_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          scanners: vuln,secret
          trivyignores: .trivyignore
          version: v0.76.2
      - name: Image-Inhalt pruefen (Schichten, vor dem Push)
        shell: bash
        env:
          IMG_REF: release-scan/${{ env.IMG_NAME }}:${{ github.sha }}
        run: bash scripts/check-image-content.sh --image "$IMG_REF"
      - name: Multi-Arch bauen und nach GHCR pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.IMG_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMG_NAME }}
      - name: Arch-Smoke
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for pair in "linux/amd64:x86_64" "linux/arm64:aarch64"; do
            plat="${pair%%:*}"; want="${pair##*:}"
            img="ghcr.io/$OWNER/$IMG_NAME:$REF_NAME"
            got=$(docker run --rm --platform "$plat" --entrypoint python "$img" -c "import platform; print(platform.machine())")
            echo "$plat -> $got"
            if [ "$got" != "$want" ]; then
              echo "FEHLER: $plat lieferte '$got' statt '$want'" >&2
              exit 1
            fi
            docker run --rm --platform "$plat" --entrypoint pip "$img" check
          done
